# Deploys the Cloudflare Worker (API + website + admin panel + Telegram bot) and applies new D1 migrations.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['6-Cloudflare-Worker/**']

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 6-Cloudflare-Worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply vajeyar-db --remote
      - name: Deploy
        run: npx wrangler deploy
      - name: Smoke test
        run: curl -fsS https://vajeyar.mohammadfakhari59.workers.dev/api/config
