# Builds every VajeYar app from the same frontend (6-Cloudflare-Worker/public) and publishes a GitHub release.
#   • Android APK (signed with the release key stored in the repository secrets)
#   • Windows: installer + portable exe   • macOS: dmg + zip (universal)   • Linux: AppImage + deb
#   • Web/PWA bundle (zip)
# Run it from Actions → "Build apps" → Run workflow, or push a tag like v3.0.0.
name: Build apps

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release (tag = v<version>)'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 4-Android-APK-Capacitor } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Restore the release signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::warning::No signing key secret — the APK will be unsigned"; exit 0; fi
          mkdir -p keystore
          echo "$KS_B64" | base64 -d > keystore/vajeyar-release.jks
          printf 'storeFile=../../keystore/vajeyar-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > keystore/keystore.properties
      - run: npm ci
      - run: npm run copy-web
      - run: npx cap sync android
      - name: Build the APK
        working-directory: 4-Android-APK-Capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/VajeYar-$V.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: 4-Android-APK-Capacitor/out/*.apk, if-no-files-found: error }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: 3-Desktop-Source-Electron } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run dist:win
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: '3-Desktop-Source-Electron/dist/*.exe', if-no-files-found: error }

  macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: 3-Desktop-Source-Electron } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            3-Desktop-Source-Electron/dist/*.dmg
            3-Desktop-Source-Electron/dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 3-Desktop-Source-Electron } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            3-Desktop-Source-Electron/dist/*.AppImage
            3-Desktop-Source-Electron/dist/*.deb
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the web app / PWA
        run: |
          V=$(node -p "require('./6-Cloudflare-Worker/package.json').version")
          mkdir -p out
          cd 6-Cloudflare-Worker/public && zip -qr "../../out/VajeYar-Web-$V.zip" . -x 'admin/*'
      - uses: actions/upload-artifact@v4
        with: { name: web, path: out/*.zip }

  release:
    needs: [android, windows, macos, linux, web]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Version
        id: v
        run: echo "tag=v$(node -p "require('./3-Desktop-Source-Electron/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.v.outputs.tag }}
          name: VajeYar ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: dist/*
