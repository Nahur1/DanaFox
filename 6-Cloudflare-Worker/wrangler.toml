# VajeYar on Cloudflare: web app + admin panel (static assets), API, sync and the Telegram bot — one Worker + one D1 database.
name = "vajeyar"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/tg/*"]

[[d1_databases]]
binding = "DB"
database_name = "vajeyar-db"
database_id = "2de9384a-a623-4270-acc6-0b6381345e1c"
migrations_dir = "migrations"

# reminders + word of the day for the Telegram bot (checked every 15 minutes, sent at each user's chosen local time)
[triggers]
crons = ["*/15 * * * *"]

[vars]
APP_NAME = "VajeYar"
ALLOW_REGISTRATION = "true"
ALLOW_GUEST = "true"
SESSION_DAYS = "90"
PUBLIC_URL = "https://vajeyar.mohammadfakhari59.workers.dev"
# Admin access is granted ONLY to these Telegram numeric ids (comma separated) …
ADMIN_TG_IDS = "8221804913"
# …and site accounts with these e-mails (comma separated) can also sign in to the admin panel with their password
ADMIN_EMAILS = "nahuram7798@gmail.com"
# the bot token is a secret:  npx wrangler secret put TG_BOT_TOKEN

# optional AI tutor (sentence check / word explanation). Remove this block if your account has no Workers AI.
[ai]
binding = "AI"

[observability]
enabled = true